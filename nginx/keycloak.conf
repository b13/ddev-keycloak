#ddev-generated
# Keycloak, served under the same public host as the project on /keycloak.
# Used when webserver_type is nginx-fpm (the default); ignored otherwise.
#
# DDEV includes every .ddev/nginx/*.conf at the end of the web container's
# server block, which is why this works as a plain location.
#
# Why here and not in ddev-router: this hop is the only one guaranteed to be in
# the request path. A router rule would have to name the hostname, and in a CI
# review app that name only exists once the pipeline runs. Whatever the proxy in
# front does - preserve the Host header, rewrite it, or bypass ddev-router
# altogether - if the site is reachable then /keycloak is reachable, and it
# inherits whatever access control that proxy applies instead of exposing the
# admin console on a port of its own.
#
# The prefix comes from KC_HTTP_RELATIVE_PATH in docker-compose.keycloak.yaml.
# Change both together.
location ^~ /keycloak {
    # ^~ so this beats the regex locations DDEV emits above for static files,
    # which would otherwise claim Keycloak's own assets.

    # Resolved per request through Docker's embedded DNS, via a variable. With a
    # literal upstream nginx refuses to start while the Keycloak container is
    # not up yet, which would take the whole site down with it on a cold boot.
    resolver 127.0.0.11 valid=10s;
    set $keycloak_upstream http://keycloak:8080;
    proxy_pass $keycloak_upstream$request_uri;

    proxy_http_version 1.1;
    # Without this nginx would send the upstream name as the Host header.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # X-Forwarded-Proto and -Host are passed through untouched rather than
    # rebuilt: $scheme is plain http on this hop because ddev-router terminates
    # TLS, and the URLs Keycloak generates come from KC_HOSTNAME anyway.

    # Keycloak's cookies and headers do not fit the default buffers.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
}
