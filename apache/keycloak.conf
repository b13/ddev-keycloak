#ddev-generated
# Keycloak, served under the same public host as the project on /keycloak.
# The Apache counterpart of .ddev/nginx/keycloak.conf - used when
# webserver_type is apache-fpm; ignored otherwise. See that file for why the
# proxy lives in the web container rather than in ddev-router.
#
# DDEV copies the whole .ddev/apache directory over /etc/apache2/sites-enabled,
# so this file is read at server scope, not inside DDEV's <VirtualHost> blocks.
# That is fine: ProxyPassInherit defaults to On, so both vhosts pick these up.
#
# The prefix comes from KC_HTTP_RELATIVE_PATH in docker-compose.keycloak.yaml.
# Change both together.

# DDEV enables only mod_proxy_fcgi, so mod_proxy_http has to be pulled in here.
# Guarded so this stays correct if DDEV ever enables them itself.
<IfModule !proxy_module>
    LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
</IfModule>

<IfModule proxy_http_module>
    # retry=0 so a request right after a cold boot retries the backend
    # immediately instead of being refused for the next 60 seconds. Apache
    # resolves the upstream per request, so it starts fine while the Keycloak
    # container is still booting - only /keycloak errors until it is up.
    ProxyPass /keycloak http://keycloak:8080/keycloak retry=0
    ProxyPassReverse /keycloak http://keycloak:8080/keycloak

    # ProxyPreserveHost is deliberately left at its default: it is a
    # server-scope switch that would apply to mod_proxy_fcgi as well, and the
    # URLs Keycloak generates come from KC_HOSTNAME, not from the Host header.
</IfModule>
