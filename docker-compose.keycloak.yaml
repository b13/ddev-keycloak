#ddev-generated
services:
  keycloak:
    container_name: ddev-${DDEV_SITENAME}-keycloak
    hostname: ${DDEV_SITENAME}-keycloak
    image: ${KEYCLOAK_DOCKER_IMAGE:-quay.io/keycloak/keycloak:26.7}
    # Wrapped so ddev's mkcert root CA lands in Keycloak's truststore directory,
    # which Keycloak auto-loads. Without it, outgoing HTTPS calls from Keycloak to
    # https://<project>.ddev.site (identity brokering, OIDC discovery) fail the TLS
    # handshake. The copy is best-effort: hosts without mkcert simply get no CA.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /opt/keycloak/conf/truststores;
        cp -f /mnt/ddev-global-cache/mkcert/rootCA.pem /opt/keycloak/conf/truststores/ 2>/dev/null || true;
        exec /opt/keycloak/bin/kc.sh start-dev --proxy-headers xforwarded --import-realm
    depends_on:
      - keycloak-database
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=8442:8080
      - HTTPS_EXPOSE=8443:8080
      - KC_LOG_LEVEL=DEBUG
      - KC_LOG_CONSOLE_OUTPUT=default
      - KC_HOSTNAME=https://${DDEV_SITENAME}.${DDEV_TLD}:8443
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=password
      - KC_DB=mariadb
      - KC_DB_PASSWORD=db
      - KC_DB_USERNAME=db
      - KC_DB_URL_PORT=3306
      - KC_DB_URL=jdbc:mariadb://keycloak-database:3334/db?characterEncoding=UTF-8
    volumes:
      - "ddev-global-cache:/mnt/ddev-global-cache:z"
      - "keycloak:/opt/keycloak/data/"
      - ".:/mnt/ddev_config"
      - "./keycloak/themes:/opt/keycloak/themes/"
    external_links:
      - ddev-router:$DDEV_HOSTNAME
  keycloak-database:
    container_name: ddev-${DDEV_SITENAME}-keycloak-database
    image: ${KEYCLOAK_DB_DOCKER_IMAGE:-mariadb:10.11}
    environment:
      - MYSQL_DATABASE=db
      - MYSQL_USER=db
      - MYSQL_PASSWORD=db
      - MYSQL_TCP_PORT=3334
      - MYSQL_ROOT_PASSWORD=db
    volumes:
      - "keycloak-db:/var/lib/mysql/"
  web:
    links:
      - keycloak

volumes:
  keycloak:
  keycloak-db:
